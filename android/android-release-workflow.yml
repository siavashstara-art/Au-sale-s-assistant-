name: Build ClinicYar VIP Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK (CafeBazaar/Myket) & AAB (Google Play)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK & AAB Bundle
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK (For CafeBazaar, Myket & Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: ClinicYar-VIP-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ClinicYar-VIP-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
